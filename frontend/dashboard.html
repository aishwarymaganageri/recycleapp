<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - Recycle App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="navbar">
    <button type="button" class="menu-toggle" id="menuToggle">&#9776;</button>
    <div class="nav-logo">♻️ RecycleApp</div>
    <div class="nav-links desktop-nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="addwaste.html">Add Waste</a>
      <a href="history.html">History</a>
      <a href="scanner.html">Image Scanner</a>
      <a href="index.html" data-action="logout">Logout</a>
    </div>
  </nav>
  <aside class="side-menu" id="sideMenu">
    <div class="side-menu-header">
      <strong>Menu</strong>
      <button type="button" class="side-menu-close" id="closeMenuBtn">&times;</button>
    </div>
    <nav class="side-menu-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="addwaste.html">Add Waste</a>
      <a href="history.html">History</a>
      <a href="scanner.html">Image Scanner</a>
      <a href="index.html" data-action="logout">Logout</a>
    </nav>
  </aside>
  <div class="menu-backdrop" id="menuBackdrop"></div>

  <section class="hero">
    <h1>Welcome, <span id="userName"></span>!</h1>
    <p class="hero-sub">Track your recycling, earn points, and make a difference!</p>
  </section>

  <div class="container">
    <div class="dashboard-info">
      <p>Total Points: <span id="totalPoints">0</span></p>
      <button onclick="location.href='addwaste.html'">Add Waste</button>
      <button onclick="location.href='history.html'">View History</button>
      <button onclick="location.href='scanner.html'">Image Scanner</button>
      <button id="logoutBtn">Logout</button>
    </div>
    <div id="notification"></div>
  </div>

  <footer class="footer">
    <p>&copy; 2026 Smart Recycling Assistant | Built for Hackathons 🚀</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
